    <style>
        .lg-backdrop { background-color: #fff !important; }
        .lg-close { color: #000 !important; font-size: 28px; top: 20px !important; right: 20px !important; }
        .lg-next, .lg-prev {
            color: #000 !important;
            font-size: 36px;
            width: 60px;
            height: 60px;
            top: 50% !important;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
        }
        .lg-next:hover, .lg-prev:hover { background: rgba(255,255,255,0.4); }

        .motorsport-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 8px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .motorsport-grid a {
            display: block;
            overflow: hidden;
            background: #111;
        }

        .motorsport-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .motorsport-grid a:hover img {
            transform: scale(1.025);
            opacity: 0.9;
        }

        .ms-large {
            grid-column: span 6;
            aspect-ratio: 4 / 5;
        }

        .ms-wide {
            grid-column: span 6;
            aspect-ratio: 16 / 9;
        }

        .ms-third {
            grid-column: span 4;
            aspect-ratio: 4 / 3;
        }

        .ms-full {
            grid-column: span 12;
            aspect-ratio: 21 / 9;
        }

        @media (max-width: 768px) {
            .motorsport-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .ms-large,
            .ms-wide,
            .ms-third,
            .ms-full {
                grid-column: span 1;
                aspect-ratio: auto;
            }

            .motorsport-grid img {
                height: auto;
            }
        }
    </style>
</head>
